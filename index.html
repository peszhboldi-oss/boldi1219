function gy(){const c=CID();return `<h1>Gyógyszer</h1>${db.med[c].map(m=>`<div class=card><div class=row><div><b>${E(m.name)}</b><div class=mu>${E(m.timing)} · ${E(m.phase)}</div></div>${RO()?`<input type=number value="${m.dose}" style="width:90px" onchange="A.medit('${m.id}',this.value)" aria-label="Adag"> ${E(m.unit)}`:`<b>${m.dose} ${E(m.unit)}</b>`}</div></div>`).join('')||em('Nincs rögzített készítmény.')}${RO()?`<div class=card><div class=g><input id=mn placeholder="Készítmény"><input id=md type=number placeholder="Adag"><input id=mu placeholder="Egység"><input id=mt placeholder="Napszak / darab"></div><input id=mph placeholder="Szakasz címe" style="margin-top:8px"><button class="pr w" style="margin-top:8px" onclick="A.madd()">Hozzáadás</button></div>`:''}<h2>Változásnapló</h2>${db.mlog[c].slice().reverse().map(x=>`<div class=card><span class=mu>${x.d}</span><div>${E(x.t)}</div></div>`).join('')||em('Még nincs változás.')}`}
function me2(){const c=CID(),L2=ML(c),q=(k,l)=>`<input id=m${k} type=number step=.1 placeholder="${l} (cm)">`;
return `<h1>Mérések</h1><div class="card fa"><h3>Heti mérés</h3><input id=mw type=number step=.1 inputmode=decimal placeholder="Testsúly (kg) – kötelező">${'<div class=g3 style="margin-top:8px">'+q('waist','derék')+q('chest','mell')+q('arm','kar')+q('thigh','comb')+q('shoulder','váll')+q('calf','vádli')+'</div>'}<input id=mc placeholder="Fejlődési jellemzés" style="margin-top:8px"><button class="pr w" style="margin-top:8px" onclick="A.mm()">Mérés mentése</button></div><div class=card><h3>Testsúly</h3>${chart(L2.slice().reverse().map(x=>[x.d,x.w]))}</div>${L2.map(x=>`<div class=card><div class=row><b>${x.d}</b><b>${f1(x.w)} kg</b></div><div class=mu>${['waist','chest','arm','thigh','shoulder','calf'].filter(k=>x[k]).map(k=>({waist:'derék',chest:'mell',arm:'kar',thigh:'comb',shoulder:'váll',calf:'vádli'}[k])+' '+x[k.replace(/^/,'')]).join(' · ')}</div>${x.cm?`<div>${E(x.cm)}</div>`:''}</div>`).join('')||em('Rögzítsd az első heti mérésedet.')}`}
function fo(){const c=CID(),ph=db.photos[c],ds=ph.map(x=>x.d);const a=ph.find((x,i)=>x.d==S.ma)||ph[0],b=ph.find(x=>x.d==S.mb)||ph[ph.length-1];
return `<h1>Fotónapló</h1><div class="card fa"><input id=pnote placeholder="Nézet (pl. elölnézet)"><input type=file accept="image/*" onchange="A.photo(this)" style="margin-top:8px"></div>${ph.length?`<div class=card><h3>Előtte / utána</h3><div class=g><select onchange="A.cmp('ma',this.value)">${ds.map(d=>`<option ${a&&a.d==d?'selected':''}>${d}</option>`).join('')}</select><select onchange="A.cmp('mb',this.value)">${ds.map(d=>`<option ${b&&b.d==d?'selected':''}>${d}</option>`).join('')}</select></div><div class=g style="margin-top:8px"><div><img class=ph src="${a.img}" alt="Előtte"></div><div><img class=ph src="${b.img}" alt="Utána"></div></div></div>${ph.map(x=>`<div class=card><span class=mu>${x.d} · ${E(x.note)}</span></div>`).join('')}`:em('Még nincs feltöltött fotó. A fotó nem része a streaknek.')}`}
function hf(){const c=CID(),ws=addD(mon(today),7*S.wk),g=wagg(c,ws),m=ML(c),st=streak(c,addD(ws,6)),D=db.diet[c],p=P(c),dw=curW(c)-p.sw,mx=Math.max(1,...Object.values(g.sets));
return `<h1>Heti összesítő</h1><div class=row><button onclick="A.wk(-1)" aria-label="Előző hét">‹</button><b>${ws} – ${addD(ws,6)}</b><button onclick="A.wk(1)" ${S.wk>=0?'disabled':''} aria-label="Következő hét">›</button></div>
<div class=g style="margin-top:8px"><div class=card><div class=big>${g.fd}/7</div><span class=mu>kitöltött nap · streak ${st.cur}</span></div><div class=card><div class=big>${g.ss}</div><span class=mu>edzésnap</span></div><div class=card><div class=big>${g.n}</div><span class=mu>tény szett</span></div><div class=card><div class=big>${f1(g.t/1000)} t</div><span class=mu>tonna · RPE ${f1(g.rpe)}</span></div></div>
<div class=card><h3>Szettek izomcsoportonként</h3>${Object.keys(g.sets).length?Object.entries(g.sets).map(([k,v])=>bar(k,v,mx,'szett')).join(''):em('Ebben a héten nincs tény szett.')}</div>
<div class=card><h3>Táplálkozás</h3>${bar('Átlag kcal',g.kc||0,D.kcal,'kcal')}${bar('Átlag fehérje',g.pr||0,D.p)}<div class=mu>Eltérés a céltól: ${g.kc==null?'–':(g.kc-D.kcal>0?'+':'')+f0(g.kc-D.kcal)+' kcal'}</div>${Array.from({length:7},(_,i)=>{const d=addD(ws,i),t=tot(c,d);return bar(d.slice(5),t.k,D.kcal,'kcal')}).join('')}</div>
<div class=card><h3>Regeneráció</h3><p>Alvás ${f1(g.sl)} ó · stressz ${f1(g.st)} · energia ${f1(g.en)}</p></div><div class=card><h3>Mérés</h3><p>Testsúly: ${f1(curW(c))} kg · mérőszám: ${dw>0?'+':''}${f1(dw)} kg (${f1(dw/p.sw*100)}%)</p><p class=mu>${m[0]&&m[0].cm?E(m[0].cm):''}</p>${chart(m.slice().reverse().map(x=>[x.d,x.w]))}</div>
<div class=card><h3>Érvényes dózislista</h3>${db.med[c].map(x=>`<div class=row><span>${E(x.name)}</span><span class=mu>${x.dose} ${E(x.unit)}</span></div>`).join('')||'<span class=mu>Nincs készítmény.</span>'}</div><button class="pr w" onclick="A.exp()">Heti export (CSV)</button>`}
function be(){const c=CID(),p=P(c);return `<h1>Beállítások</h1><div class=card><h3>Fejlesztési állapot</h3><div class=row><span>Mentés</span><span class=mu>csak ezen az eszközön</span></div><div class=row><span>API / PostgreSQL</span><span class=mu>nincs bekötve</span></div><div class=row><span>Bejelentkezés / jogosultság</span><span class=mu>demó, nem védett</span></div><p class=mu style="margin-bottom:0">Ne rögzíts valódi kliensadatot ebben a verzióban.</p></div><div class=card><label class=mu>Étkezések száma</label><select onchange="A.setm(this.value)"><option ${p.meals==5?'selected':''}>5</option><option ${p.meals==6?'selected':''}>6</option></select>${[['bp','Vérnyomás'],['bg','Vércukor'],['lab','Vérkép']].map(([k,l])=>`<div class=row style="margin-top:10px"><span>${l}</span><button class="${p[k]?'on':''}" onclick="A.pset('${k}',${p[k]?0:1})">${p[k]?'Be':'Ki'}</button></div>`).join('')}${p.lab?`<label class=mu>Vérkép dátuma</label><input type=date value="${p.labd}" onchange="A.pset('labd',this.value)">`:''}</div><button class=w onclick="A.exp()">Export (CSV, aktuális hét)</button><button class=w style="margin-top:8px" onclick="A.out()">Kijelentkezés</button><button class=w style="margin-top:8px" onclick="if(confirm('Visszaállítod a demó adatokat?'))A.reset()">Demó adatok visszaállítása</button>`}
function dbd(){const cs=db.users.filter(u=>u.role=='client');return `<h1>Dashboard</h1>${cs.map(u=>{const c=u.id,ds=[...Object.keys(db.ses[c]),...Object.keys(db.flog[c])].sort(),st=streak(c),m=ML(c)[0],D=db.diet[c];return `<div class=card role=button tabindex=0 style="cursor:pointer" onclick="A.cl('${c}')" onkeydown="if(event.key=='Enter')A.cl('${c}')"><div class=row><div><b>${E(u.name)}</b><div class=mu>${E(P(c).ph)}</div></div><div class=big>${f1(curW(c))} kg</div></div><div class="mu" style="margin-top:6px">Utolsó aktivitás: ${ds.length?ds[ds.length-1]:'–'} · utolsó mérés: ${m?m.d:'–'}<br>Heti kitöltött napok: ${wagg(c,mon(today)).fd}/7 · streak: ${st.cur} · étrend: ${D.kcal?f0(D.kcal)+' kcal':'nincs'} · terv: ${db.plans.filter(p=>p.cid==c&&p.act).length||'nincs'}</div></div>`}).join('')||em('Még nincs kliens.')}<div class=card><h3>Új kliens</h3><input id=nn placeholder="Név"><div class=g style="margin-top:8px"><input id=nw type=number step=.1 placeholder="Induló kg"><input id=nh type=number placeholder="Magasság cm"></div><input id=ng placeholder="Cél" style="margin-top:8px"><input id=np placeholder="Ciklus / szakasz" style="margin-top:8px"><button class="pr w" style="margin-top:8px" onclick="A.newC()">Kliens felvétele</button></div><button class=w onclick="A.out()">Kijelentkezés</button>`}
function kat(){return `<h1>Katalógus</h1><h2>Gyakorlatok</h2>${db.ex.map(e=>`<div class=card><div class=row><div><b style="${e.act?'':'opacity:.4'}">${E(e.n)}</b> <span class=mu>${E(e.mg)} · ${E(e.eq)}</span></div><button onclick="A.arch('${e.id}')">${e.act?'Archiválás':'Visszaállítás'}</button></div></div>`).join('')}<div class=card><div class=g><input id=xn placeholder="Gyakorlat neve"><input id=xm placeholder="Izomcsoport"></div><select id=xe style="margin-top:8px"><option>Szabad súly</option><option>Gép</option><option>Testsúly</option><option>Kardió</option></select><button class="pr w" style="margin-top:8px" onclick="A.nex()">Gyakorlat hozzáadása</button></div><h2>Ételek (100 g-ra)</h2>${db.foods.map(f=>`<div class=card><div class=row><b>${E(f.n)}</b><span class=mu>${f0(f.k*100)} kcal · F ${f1(f.p*100)} · Sz ${f1(f.c*100)} · Zs ${f1(f.f*100)}</span></div></div>`).join('')}<div class=card><input id=fn placeholder="Étel neve"><div class=g style="margin-top:8px"><input id=fk type=number placeholder="kcal"><input id=fp type=number placeholder="fehérje"><input id=fc type=number placeholder="szénh."><input id=ff type=number placeholder="zsír"></div><button class="pr w" style="margin-top:8px" onclick="A.nfd()">Étel hozzáadása</button></div>`}
const CP=[['ad','Adatlap'],['nap','Napi napló'],['hf','Heti összesítő'],['ed','Edzésnapló'],['et','Étrend'],['kj','Kajanapló'],['gy','Gyógyszer'],['me','Mérések'],['fo','Fotónapló'],['be','Beállítások']],PG={ad,nap,hf,ed,et,kj,gy,me:me2,fo,be};
function R(){if(!db)return;let h;if(!me)h=`<main class=lg><h1>IMPAVIDUS LAB</h1><p class=mu style="text-align:center">Train. Track. Measure. Improve.</p><div class="card" style="border-color:var(--ac2)"><b style="color:#e6a5ac">Demókörnyezet · helyi tárhely</b><p class=mu style="margin:6px 0 0">A képernyőn látható nevek és naplóadatok mintaadatok. A kiválasztás nem hitelesít valódi fiókot; a módosítások csak ezen az eszközön maradnak. Szerveroldali adatbázis és jogosultság még nincs bekapcsolva.</p></div>${db.users.filter(u=>u.role=='client').map(u=>`<button class=w onclick="A.pick('${u.id}')">Demó kliens · ${E(u.name)}</button>`).join('')}<button class="w pr" onclick="A.pick('k0')">Demó edző megnyitása</button></main>`;
else{const co=RO(),inC=!co||S.cid;let m=co&&!S.cid?(S.pg=='kat'?kat():dbd()):PG[S.pg]?PG[S.pg]():ad();
const nav=co?[['db','Dashboard'],['kat','Katalógus']].concat(S.cid?CP:[]):CP;
h=`<main class="${co?'ro':''}"><div class=demo-note>DEMÓ · A naplóadatok mintaadatok, a mentés csak ezen az eszközön történik. Nincs valódi bejelentkezés vagy szerveroldali védelem.</div>${co&&S.cid?`<button onclick="A.cl(null)">← Kliensek</button><p class=mu style="margin:6px 0 0">Edzői nézet – a tényadatok csak olvashatók.</p>`:''}${m}</main><nav>${nav.map(n=>`<button class="${(n[0]==S.pg||(n[0]=='db'&&co&&!S.cid&&S.pg!='kat'))?'on':''}" onclick="${n[0]=='db'?'A.cl(null)':`A.go('${n[0]}')`}">${n[1]}</button>`).join('')}</nav>`}
if(S.modal)h+=`<div class=md><div><h3>Export (CSV)</h3><p class=mu>Másold ki és illeszd Excelbe/Sheetsbe (pontosvesszővel elválasztva).</p><textarea rows=12 readonly onclick="this.select()">${E(S.modal)}</textarea><button class="w pr" style="margin-top:8px" onclick="A.close()">Bezárás</button></div></div>`;$('#app').innerHTML=h;sy()}
load();R();
</script></body></html>
